<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <title>관리자 대시보드 — ontrip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/admin.js?v=20261016-3"></script>
</head>
<body class="admin-page">
  <main class="admin-app">
    <section id="admin-login-view" class="admin-login-card">
      <a class="brand" href="../index.html"><span class="brand-mark">o</span> ontrip</a>
      <span class="eyebrow">ONTRIP DASHBOARD</span>
      <h1>관리자 로그인</h1>
      <p>관리자 계정으로 로그인해 예약과 사이트 정보를 관리하세요.</p>
      <form id="admin-login-form">
        <label class="form-field">관리자 이메일<input name="email" type="email" autocomplete="username" required value="yth6263@gmail.com"></label>
        <label class="form-field">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button button-dark dialog-submit" type="submit">관리자 로그인 <span>→</span></button>
      </form>
      <p id="login-error" class="admin-inline-message" role="status" hidden></p>
      <a class="admin-back-link" href="../index.html">← 여행지 사이트로 돌아가기</a>
    </section>

    <section id="admin-dashboard" hidden>
      <header class="admin-dashboard-header">
        <div><span class="eyebrow">ONTRIP DASHBOARD</span><h1>관리자 대시보드</h1><p id="admin-account"></p></div>
        <div class="admin-header-actions"><a class="button button-outline button-small" href="../index.html">사이트 보기</a><button class="button button-dark button-small" id="admin-logout" type="button">로그아웃</button></div>
      </header>
      <div class="admin-stats">
        <article><span>전체 예약</span><strong id="stat-total">…</strong></article>
        <article><span>확인 중</span><strong id="stat-pending">…</strong></article>
        <article><span>예약 확정</span><strong id="stat-confirmed">…</strong></article>
        <article><span>취소됨</span><strong id="stat-cancelled">…</strong></article>
      </div>
      <nav class="admin-tabs" aria-label="관리 메뉴">
        <button class="admin-tab active" data-tab="reservations">예약 <span id="tab-booking-count">…</span></button>
        <button class="admin-tab" data-tab="destinations">여행지 <span id="tab-destination-count">…</span></button>
        <button class="admin-tab" data-tab="stays">숙소 <span id="tab-stay-count">…</span></button>
      </nav>

      <section class="admin-panel active" id="panel-reservations">
        <div class="admin-panel-heading"><div><h2>예약 현황</h2><p>회원이 신청한 예약을 확인하고 예약 상태를 관리합니다.</p></div><button class="button button-outline button-small" id="booking-refresh" type="button">새로고침</button></div>
        <div id="booking-state" class="admin-state">예약을 불러오는 중입니다…</div>
        <div id="booking-list" class="admin-record-list"></div>
      </section>
      <section class="admin-panel" id="panel-destinations" hidden>
        <h2>여행지 관리</h2>
        <form id="destination-form" class="admin-form"><input name="id" type="hidden"><label class="form-field">여행지 이름<input name="name" required></label><label class="form-field">주소<input name="address" required></label><label class="form-field">사진 URL<input name="image" type="url" required></label><label class="form-field">소개<textarea name="description" rows="3"></textarea></label><div class="admin-form-actions"><button class="button button-dark" type="submit">여행지 저장</button><button class="button button-outline" type="reset">입력 지우기</button></div></form>
        <div id="destination-list" class="admin-record-list"></div>
      </section>
      <section class="admin-panel" id="panel-stays" hidden>
        <h2>숙소 관리</h2>
        <form id="stay-form" class="admin-form"><input name="id" type="hidden"><label class="form-field">숙소 이름<input name="name" required></label><label class="form-field">연결 여행지<select name="destinationId" required></select></label><label class="form-field">주소<input name="address" required></label><label class="form-field">전화번호<input name="phone" type="tel" required></label><label class="form-field">객실명<input name="roomName" required></label><label class="form-field">객실 수<input name="roomCount" type="number" min="1" required></label><label class="form-field">몇 인실인가요?<input name="capacity" type="number" min="1" required></label><label class="form-field">1박 요금 (원)<input name="price" type="number" min="0"></label><label class="form-field">사진 URL<input name="image" type="url"></label><div class="admin-form-actions"><button class="button button-dark" type="submit">숙소 저장</button><button class="button button-outline" type="reset">입력 지우기</button></div></form>
        <div id="stay-list" class="admin-record-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
